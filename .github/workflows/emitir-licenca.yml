name: Emitir licença

# Emissão de licença sem precisar do Mac ligado.
#
# Dispare pelo app do GitHub no celular (aba Actions -> "Emitir licença" ->
# Run workflow) ou pelo site. A chave privada NÃO fica no repositório: ela vive
# no segredo TRANSCRIBER_PRIVATE_KEY, que só existe dentro da execução.
#
# Veja Ferramentas/EMITIR-PELO-GITHUB.md para a configuração inicial.

on:
  workflow_dispatch:
    inputs:
      maquina:
        description: 'ID da máquina (o plugin mostra e copia). Aceita TL-1147-89DF-849C ou 114789DF849C'
        required: true
      nome:
        description: 'Nome do titular'
        required: true
      email:
        description: 'E-mail do titular'
        required: true
      plano:
        description: 'Validade da licença'
        required: true
        default: 'Vitalícia'
        type: choice
        options:
          - 'Vitalícia'
          - 'Mensal (30 dias)'
          - 'Trimestral (90 dias)'
          - 'Anual (365 dias)'
          - 'Teste (3 dias)'
          - 'Teste (7 dias)'
      nota:
        description: 'Observação (ex.: pago via Pix, 2 máquinas, revenda...)'
        required: false

# Só o dono dispara: workflow_dispatch já exige permissão de escrita no repo.
permissions:
  contents: write

jobs:
  emitir:
    runs-on: ubuntu-latest
    # Amarre este job a um Environment chamado "licencas" com "Required reviewers"
    # = você. Aí toda emissão espera a sua aprovação, mesmo que alguém consiga
    # disparar o workflow. Veja o LEIA-ME.
    environment: licencas

    steps:
      - uses: actions/checkout@v4

      - name: Converte o plano em dias
        id: plano
        run: |
          case "${{ inputs.plano }}" in
            "Vitalícia")            echo "dias=0"   >> "$GITHUB_OUTPUT" ;;
            "Mensal (30 dias)")     echo "dias=30"  >> "$GITHUB_OUTPUT" ;;
            "Trimestral (90 dias)") echo "dias=90"  >> "$GITHUB_OUTPUT" ;;
            "Anual (365 dias)")     echo "dias=365" >> "$GITHUB_OUTPUT" ;;
            "Teste (3 dias)")       echo "dias=3"   >> "$GITHUB_OUTPUT" ;;
            "Teste (7 dias)")       echo "dias=7"   >> "$GITHUB_OUTPUT" ;;
            *) echo "Plano desconhecido: ${{ inputs.plano }}"; exit 1 ;;
          esac

      - name: Grava a chave privada num arquivo temporário
        env:
          CHAVE: ${{ secrets.TRANSCRIBER_PRIVATE_KEY }}
        run: |
          if [ -z "$CHAVE" ]; then
            echo "::error::Falta o segredo TRANSCRIBER_PRIVATE_KEY. Nenhuma licença foi emitida."
            {
              echo "## Falta configurar a chave de assinatura"
              echo ""
              echo "Nenhuma licença foi emitida — e isso é o esperado: sem a chave privada"
              echo "não existe assinatura válida."
              echo ""
              echo "**No seu Mac**, copie a chave:"
              echo ""
              echo '```'
              echo 'pbcopy < ~/Documents/TranscriberLive-Licencas/transcriberlive-private.key'
              echo '```'
              echo ""
              echo "**No GitHub**, neste repositório:"
              echo ""
              echo "Settings → Secrets and variables → **Actions** → *New repository secret*"
              echo ""
              echo "| campo | valor |"
              echo "|---|---|"
              echo "| Name | \`TRANSCRIBER_PRIVATE_KEY\` |"
              echo "| Secret | cole a chave |"
              echo ""
              echo "Atenção aos dois erros mais comuns: criar em *Variables* em vez de"
              echo "*Secrets*, e criar em *Dependabot* em vez de *Actions*. Precisa ser"
              echo "**Actions → Secrets**."
              echo ""
              echo "Depois é só rodar este workflow de novo. Detalhes em"
              echo "\`Ferramentas/EMITIR-PELO-GITHUB.md\`."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          umask 077
          printf '%s' "$CHAVE" > "$RUNNER_TEMP/priv.key"

          # erro classico: colar o conteudo errado (a chave PUBLICA, ou o arquivo
          # cortado). Melhor descobrir aqui do que numa licenca invalida no cliente.
          if ! python3 -c 'import json,sys; k=json.load(open(sys.argv[1])); m=[c for c in ("n","e","d") if c not in k]; sys.exit("faltam os campos "+", ".join(m)) if m else None' "$RUNNER_TEMP/priv.key" 2>/tmp/erro; then
            echo "::error::O segredo TRANSCRIBER_PRIVATE_KEY não parece ser a chave privada ($(cat /tmp/erro))."
            echo "Ele precisa ser o conteúdo do arquivo transcriberlive-private.key (um JSON com n, e, d)," >> "$GITHUB_STEP_SUMMARY"
            echo "não a linha da chave pública que fica embutida no plugin." >> "$GITHUB_STEP_SUMMARY"
            rm -f "$RUNNER_TEMP/priv.key"
            exit 1
          fi

      - name: Emitir
        id: emitir
        env:
          TL_CHAVE:   ${{ runner.temp }}/priv.key
          TL_MAQUINA: ${{ inputs.maquina }}
          TL_NOME:    ${{ inputs.nome }}
          TL_EMAIL:   ${{ inputs.email }}
          TL_DIAS:    ${{ steps.plano.outputs.dias }}
          TL_NOTA:    ${{ inputs.nota }}
          TL_SAIDA:   saida
          TL_REGISTRO: registro/licencas-emitidas.csv
        run: python3 Ferramentas/emitir_ci.py

      - name: Apaga a chave do disco
        if: always()
        run: rm -f "$RUNNER_TEMP/priv.key"

      - name: Anexa a licença ao run
        uses: actions/upload-artifact@v4
        with:
          name: licenca-${{ steps.emitir.outputs.serial }}
          path: saida/*.txt
          retention-days: 90

      # O contexto `secrets` nao e confiavel dentro de `if:` de um step, entao
      # a checagem vira um output.
      - name: Telegram esta configurado?
        id: tg
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT:  ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "$TG_TOKEN" ] && [ -n "$TG_CHAT" ]; then
            echo "ok=sim" >> "$GITHUB_OUTPUT"
          else
            echo "ok=nao" >> "$GITHUB_OUTPUT"
            echo "Telegram nao configurado — a licenca fica so no artefato."
          fi

      - name: Manda no Telegram
        if: steps.tg.outputs.ok == 'sim'
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT:  ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          LEGENDA="Licença ${{ steps.emitir.outputs.serial }}
          ${{ inputs.nome }} <${{ inputs.email }}>
          máquina ${{ steps.emitir.outputs.maquina }}
          ${{ steps.emitir.outputs.validade }}"
          curl -sS -f -X POST \
            "https://api.telegram.org/bot$TG_TOKEN/sendDocument" \
            -F "chat_id=$TG_CHAT" \
            -F "caption=$LEGENDA" \
            -F "document=@${{ steps.emitir.outputs.arquivo }}" > /dev/null
          echo "Licença enviada no Telegram."

      - name: Registra a venda no repositório
        continue-on-error: true
        run: |
          git config user.name  "Emissor de licencas"
          git config user.email "noreply@github.com"
          git add registro/licencas-emitidas.csv
          if git diff --cached --quiet; then
            echo "Nada a registrar."
            exit 0
          fi
          git commit -m "Licenca ${{ steps.emitir.outputs.serial }} para ${{ inputs.nome }}"
          # se alguém emitiu ao mesmo tempo, rebase e tenta de novo
          for tentativa in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep 5
          done
          echo "::warning::Não consegui registrar no CSV do repositório (a licença foi emitida normalmente)."

      - name: Resumo
        run: |
          {
            echo "## Licença emitida"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Titular | ${{ inputs.nome }} |"
            echo "| E-mail | ${{ inputs.email }} |"
            echo "| Máquina | ${{ steps.emitir.outputs.maquina }} |"
            echo "| Serial | \`${{ steps.emitir.outputs.serial }}\` |"
            echo "| Validade | ${{ steps.emitir.outputs.validade }} |"
            echo "| Nota | ${{ inputs.nota }} |"
            echo ""
            echo "O arquivo está em **Artifacts**, no rodapé desta página: baixe e mande para o cliente."
          } >> "$GITHUB_STEP_SUMMARY"
