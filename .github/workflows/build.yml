name: Build plugin

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            name: macOS
            targets: TranscriberLive_VST3 TranscriberLive_AU TranscriberLiveDisplay_VST3 TranscriberLiveDisplay_AU TranscriberLiveDisplayApp
            artefacts: build/TranscriberLive_artefacts/Release
          - os: windows-2022
            name: Windows
            targets: TranscriberLive_VST3 TranscriberLiveDisplay_VST3 TranscriberLiveDisplayApp
            artefacts: build/TranscriberLive_artefacts/Release

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DTRANSCRIBER_COPY_PLUGIN=OFF ${{ matrix.os == 'windows-2022' && '-G "Visual Studio 17 2022" -A x64' || '-G Xcode' }}

      - name: Build
        run: cmake --build build --config Release --target ${{ matrix.targets }} --parallel 4

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: TranscriberLive-${{ matrix.name }}
          path: |
            build/TranscriberLive_artefacts/Release
            build/TranscriberLiveDisplay_artefacts/Release
            build/TranscriberLiveDisplayApp_artefacts/Release

  # ---------------------------------------------------------------------------
  # Instalador do Windows (.exe unico, com download dos modelos)
  # ---------------------------------------------------------------------------
  installer-windows:
    needs: build
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Baixa os binarios do Windows
        uses: actions/download-artifact@v4
        with:
          name: TranscriberLive-Windows
          path: binarios

      - name: Confere o que chegou
        shell: pwsh
        run: |
          Get-ChildItem -Recurse -Depth 4 binarios |
            Where-Object { $_.Name -like "*.vst3" -or $_.Name -like "*.exe" } |
            Select-Object -ExpandProperty FullName

      - name: Instala o Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Monta o instalador
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $iscc "/DBIN=$(Resolve-Path binarios)" Instalador\Windows\TranscriberLive.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC falhou ($LASTEXITCODE)" }

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: TranscriberLive-Windows-Setup
          path: Instalador/Windows/saida/*.exe

  # ---------------------------------------------------------------------------
  # Instalador do macOS (.pkg unico, com escolha e download dos modelos)
  # ---------------------------------------------------------------------------
  installer-macos:
    needs: build
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Baixa os binarios do macOS
        uses: actions/download-artifact@v4
        with:
          name: TranscriberLive-macOS
          path: Instalador/binarios

      - name: Confere o que chegou
        run: find Instalador/binarios -maxdepth 5 \( -name "*.vst3" -o -name "*.component" -o -name "*.app" \)

      - name: Monta o instalador
        env:
          TL_NAO_INTERATIVO: "1"
        run: |
          chmod +x Instalador/montar-instalador.command Instalador/scripts/postinstall
          Instalador/montar-instalador.command "$PWD/Instalador/binarios"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: TranscriberLive-macOS-Installer
          path: Instalador/saida/*.pkg
