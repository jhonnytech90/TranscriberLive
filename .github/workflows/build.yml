name: Build plugin

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            name: macOS
            targets: TranscriberLive_VST3 TranscriberLive_AU TranscriberLiveDisplay_VST3 TranscriberLiveDisplay_AU TranscriberLiveDisplayApp
            artefacts: build/TranscriberLive_artefacts/Release
          - os: windows-2022
            name: Windows
            targets: TranscriberLive_VST3 TranscriberLiveDisplay_VST3 TranscriberLiveDisplayApp
            artefacts: build/TranscriberLive_artefacts/Release

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # Windows: a mesma trava que existe no macOS.
      #
      # O ggml precisa sair daqui com AVX2/FMA ligados. Ja rodamos meses com
      # eles DESLIGADOS (TRANSCRIBER_PORTABLE_CPU=ON) e o sintoma na mao do
      # cliente foi atraso de 40 s a 3 min -- e texto errado, porque a
      # lentidao dispara a troca automatica de modelo e o modo economico.
      # Um build sem SIMD nao pode mais sair daqui calado.
      # -----------------------------------------------------------------------
      # Escape hexadecimal grudado num digito hex: "\xc3\xa7" seguido de "a" vira
      # "\xa7a", que o MSVC recusa ("escape sequence out of range"). O clang
      # aceita e trunca calado, entao isto so aparecia no build do Windows,
      # depois de tres minutos de compilacao. Um grep de dois segundos resolve.
      - name: Escape hexadecimal grudado em digito (texto em portugues)
        shell: bash
        run: |
          set -euo pipefail
          if grep -rnP '\\x[0-9a-fA-F]{2}(?=[0-9a-fA-F])' Source Tests --include='*.h' --include='*.cpp'; then
            echo "::error::escape hexadecimal seguido de digito hex -- corte o literal: \"...\\xc3\\xa7\" \"a...\""
            exit 1
          fi
          echo "nenhum escape ambiguo"

      - name: Configure (Windows)
        if: matrix.os == 'windows-2022'
        shell: bash
        run: |
          set -e -o pipefail
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DTRANSCRIBER_COPY_PLUGIN=OFF \
                -DTRANSCRIBER_PORTABLE_CPU=OFF \
                -G "Visual Studio 17 2022" -A x64 2>&1 | tee cfg-win.log

          if grep -qi "Unknown CPU architecture" cfg-win.log; then
            echo "::error::ggml caiu no modo generico no Windows -- SIMD desligado"
            exit 1
          fi
          if ! grep -qiE "x86 detected|AVX2|arch:AVX2" cfg-win.log; then
            echo "::error::o configure nao reportou AVX2 -- o motor sairia escalar"
            grep -iE "detected|AVX|FMA|F16C|SIMD" cfg-win.log || true
            exit 1
          fi
          echo "SIMD detectado no Windows:"
          grep -iE "x86 detected|AVX|FMA|F16C" cfg-win.log | sort -u || true

      - name: Build (Windows)
        if: matrix.os == 'windows-2022'
        run: cmake --build build --config Release --target ${{ matrix.targets }} --parallel 4

      # -----------------------------------------------------------------------
      # Testes de vocabulario e QR Code.
      #
      # Rodam so no Windows por economia: o codigo testado nao tem nada de
      # especifico de plataforma, e uma passada ja pega a regressao. Os dois
      # bugs que motivaram estes testes (o corretor trocando "ponto" por
      # "ponte", e o Reed-Solomon montado ao contrario) passariam batido em
      # qualquer revisao de codigo -- os dois produziam saida plausivel.
      # -----------------------------------------------------------------------
      - name: Testes (vocabulario e QR)
        if: matrix.os == 'windows-2022'
        shell: bash
        run: |
          set -e
          cmake -B build-tests -DCMAKE_BUILD_TYPE=Release -DTRANSCRIBER_BUILD_TESTS=ON \
                -DTRANSCRIBER_COPY_PLUGIN=OFF -DTRANSCRIBER_PORTABLE_CPU=OFF \
                -G "Visual Studio 17 2022" -A x64 > /dev/null
          cmake --build build-tests --config Release --target VocabQrTest --parallel 4
          ./build-tests/VocabQrTest_artefacts/Release/VocabQrTest.exe

      # -----------------------------------------------------------------------
      # macOS: UMA PASSADA POR ARQUITETURA, depois lipo.
      #
      # Compilar "arm64;x86_64" de uma vez so faz o ggml nao reconhecer a
      # arquitetura e cair no caminho generico escalar (-DGGML_CPU_GENERIC),
      # sem AVX2 nem NEON, nas duas fatias. No Apple Silicon o Metal esconde
      # isso; no Intel nao ha Metal e o resultado foi RTF 14 (1,1 s de fala
      # levando 16 s) num MacBook Air 2019.
      #
      # Duas passadas custam mais tempo de build. Sao minutos de CI contra um
      # fator de ~10x na maquina do cliente.
      # -----------------------------------------------------------------------
      - name: Compila arm64 e x86_64 em separado (macOS)
        if: matrix.os == 'macos-14'
        run: |
          # pipefail e obrigatorio aqui: sem ele, o "| tee" mascara a falha do
          # cmake e o build segue em frente com uma configuracao quebrada.
          set -e -o pipefail
          for ARCH in arm64 x86_64; do
            echo "::group::configure $ARCH"
            cmake -B "build-$ARCH" -G Xcode -DTRANSCRIBER_COPY_PLUGIN=OFF \
                  -DTL_OSX_ARCH="$ARCH" 2>&1 | tee "cfg-$ARCH.log"
            echo "::endgroup::"

            # Trava: se o ggml voltar ao modo generico, o build para aqui.
            # Sem isso o problema volta calado e so aparece na mao do cliente.
            if grep -qi "Unknown CPU architecture" "cfg-$ARCH.log"; then
              echo "::error::ggml caiu no modo generico em $ARCH — SIMD desligado"
              exit 1
            fi
            echo "SIMD detectado em $ARCH:"
            grep -iE "ARM detected|x86 detected|AVX2|FMA|NEON" "cfg-$ARCH.log" | sort -u || true

            echo "::group::build $ARCH"
            cmake --build "build-$ARCH" --config Release --target ${{ matrix.targets }} --parallel 4
            echo "::endgroup::"
          done

      - name: Junta as fatias num binario universal (macOS)
        if: matrix.os == 'macos-14'
        run: |
          set -e
          rm -rf build && mkdir -p build
          for D in TranscriberLive_artefacts TranscriberLiveDisplay_artefacts TranscriberLiveDisplayApp_artefacts; do
            cp -R "build-arm64/$D" "build/$D"
          done

          # Para cada Mach-O da arvore arm64, junta com o par x86_64.
          N=0
          while IFS= read -r F; do
            file -b "$F" | grep -q "Mach-O" || continue
            REL="${F#build/}"
            X="build-x86_64/$REL"
            if [ ! -f "$X" ]; then
              echo "::error::sem par x86_64 para $REL"; exit 1
            fi
            lipo -create "$F" "$X" -output "$F.univ"
            mv "$F.univ" "$F"
            chmod +x "$F"
            N=$((N+1))
            echo "  universal: $REL  ->  $(lipo -archs "$F")"
          done < <(find build -type f)

          [ "$N" -ge 5 ] || { echo "::error::esperava pelo menos 5 binarios, juntei $N"; exit 1; }
          echo "$N binarios universais."

          # ---- re-assinar: o lipo invalida a assinatura do bundle -------------
          #
          # O Xcode assina cada bundle (ad-hoc) ao compilar. Trocar o binario
          # por dentro, como o lipo faz, quebra essa assinatura -- e bundle com
          # assinatura invalida o macOS recusa carregar, com erro generico.
          # Entao re-assinamos cada bundle depois da juncao.
          while IFS= read -r B; do
            codesign --force --sign - --timestamp=none "$B" 2>&1 | sed 's/^/    /'
            codesign --verify --deep "$B" || { echo "::error::assinatura invalida: $B"; exit 1; }
            echo "  assinado: $(basename "$B")"
          done < <(find build -maxdepth 4 \( -name '*.vst3' -o -name '*.component' -o -name '*.app' \) -type d)

          # confere que todos tem as duas arquiteturas
          while IFS= read -r F; do
            file -b "$F" | grep -q "Mach-O" || continue
            A=$(lipo -archs "$F")
            case "$A" in
              *arm64*x86_64*|*x86_64*arm64*) ;;
              *) echo "::error::$F ficou so com: $A"; exit 1 ;;
            esac
          done < <(find build -type f)
          echo "Todos os binarios tem arm64 + x86_64."

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: TranscriberLive-${{ matrix.name }}
          path: |
            build/TranscriberLive_artefacts/Release
            build/TranscriberLiveDisplay_artefacts/Release
            build/TranscriberLiveDisplayApp_artefacts/Release

  # ---------------------------------------------------------------------------
  # Instalador do Windows (.exe unico, com download dos modelos)
  # ---------------------------------------------------------------------------
  installer-windows:
    needs: build
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Baixa os binarios do Windows
        uses: actions/download-artifact@v4
        with:
          name: TranscriberLive-Windows
          path: binarios

      - name: Confere o que chegou
        shell: pwsh
        run: |
          Get-ChildItem -Recurse -Depth 4 binarios |
            Where-Object { $_.Name -like "*.vst3" -or $_.Name -like "*.exe" } |
            Select-Object -ExpandProperty FullName

      - name: Instala o Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Monta o instalador
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          $ver = (Get-Content VERSAO -Raw).Trim()
          Write-Host "versao: $ver"
          & $iscc "/DAPPVERSION=$ver" "/DBIN=$(Resolve-Path binarios)" Instalador\Windows\TranscriberLive.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC falhou ($LASTEXITCODE)" }

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: TranscriberLive-Windows-Setup
          path: Instalador/Windows/saida/*.exe

      # Igual ao macOS: link fixo, para mandar ao cliente sem ele precisar
      # entrar no Actions, achar o run certo e baixar um zip.
      - name: Publica na Release "windows-latest"
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -e
          gh release view windows-latest >/dev/null 2>&1 || \
            gh release create windows-latest --title "Transcriber Live - Windows (build mais recente)" \
               --notes "Instalador do Windows, gerado automaticamente a cada build. Instala os plugins VST3, o aplicativo do Display e baixa os modelos de voz." \
               --latest=false
          gh release upload windows-latest Instalador/Windows/saida/*.exe --clobber

          # O nome do arquivo passou a levar a versao, entao "--clobber" nao
          # sobrescreve mais nada: a Release acumularia um .exe por versao e o
          # cliente que entrasse na pagina escolheria no chute -- varias vezes o
          # antigo, que esta acima na lista. Fica so a versao deste build.
          VER=$(tr -d ' \n\r' < VERSAO)
          gh release view windows-latest --json assets -q '.assets[].name' | while read -r A; do
            case "$A" in
              *"-$VER-"*|*"-$VER."*) ;;
              "") ;;
              *) gh release delete-asset windows-latest "$A" -y && echo "removido da Release: $A" ;;
            esac
          done

          # mesmo motivo do macOS: a pagina mostraria a data da tag, nao a do arquivo
          gh release edit windows-latest \
            --title "Transcriber Live $(tr -d ' \n\r' < VERSAO) - Windows ($(date -u '+%d/%m/%Y %H:%M') UTC)" \
            --notes "Instalador do Windows, gerado automaticamente.

          **Atualizado em:** $(date -u '+%d/%m/%Y as %H:%M') UTC
          **Commit:** \`${GITHUB_SHA:0:7}\`

          Instala os plugins VST3, o aplicativo do Display e baixa os modelos de voz."

          echo "### Download" >> "$GITHUB_STEP_SUMMARY"
          echo "Instalador do Windows em <${{ github.server_url }}/${{ github.repository }}/releases/tag/windows-latest>" >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Instalador do macOS (.pkg offline, modelos embutidos) + desinstalador
  # ---------------------------------------------------------------------------
  installer-macos:
    needs: build
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Baixa os binarios do macOS
        uses: actions/download-artifact@v4
        with:
          name: TranscriberLive-macOS
          path: Instalador/binarios

      - name: Baixa os modelos (ficam EMBUTIDOS no instalador)
        run: |
          set -e
          mkdir -p Instalador/modelos
          baixar() {   # baixar <arquivo> <url> <sha256>
            echo "  $1"
            curl -fL --retry 3 --retry-delay 5 --connect-timeout 30 -sS -o "Instalador/modelos/$1" "$2"
            GOT=$(shasum -a 256 "Instalador/modelos/$1" | awk '{print $1}')
            if [ "$GOT" != "$3" ]; then
              echo "::error::SHA-256 de $1 nao confere (esperado $3, obtido $GOT)"
              exit 1
            fi
          }
          baixar ggml-silero-v5.1.2.bin \
            "https://huggingface.co/ggml-org/whisper-vad/resolve/main/ggml-silero-v5.1.2.bin" \
            29940d98d42b91fbd05ce489f3ecf7c72f0a42f027e4875919a28fb4c04ea2cf
          # ---------------------------------------------------------------
          # Dois modelos, e so dois. Nao e economia de espaco: e o teto de
          # 2 GiB por arquivo do GitHub Releases.
          #
          #   turbo 1,51 GiB + base 0,14 GiB + VAD + binarios = ~1,70 GiB  OK
          #   ...com o small junto                            = ~2,15 GiB  ESTOURA
          #
          # Entre small e turbo o turbo ganha com folga no Apple Silicon (o
          # Metal faz o encoder; o decoder dele tem 4 camadas no lugar de 32).
          # E o small nunca serviu em Mac Intel -- medimos RTF ~4 num Air
          # 2019, ou seja, 4 segundos de processamento por segundo de fala.
          # Em Intel quem serve e o base. Entao small nao tem dono aqui.
          # ---------------------------------------------------------------

          # Apple Silicon: o que mais acerta sem perder o tempo real.
          baixar ggml-large-v3-turbo.bin \
            "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-large-v3-turbo.bin" \
            1fc70f774d38eb169993ac391eea357ef47c88757ef72ee5943879b7e8e2bc69

          # Mac Intel e qualquer maquina que nao acompanhe. O plugin escolhe
          # sozinho e desce para ca se a medicao do RTF mandar.
          baixar ggml-base.bin \
            "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base.bin" \
            60ed5bc3dd14eea856493d334349b405782ddcaf0028d4b5df4088345fba2efe

          ls -lh Instalador/modelos

      - name: Monta o instalador e o desinstalador
        env:
          TL_NAO_INTERATIVO: "1"
        run: |
          # Mesma versao que o CMake compilou: os dois leem o arquivo VERSAO.
          export TL_VERSAO="$(tr -d ' \n\r' < VERSAO)"
          echo "versao: $TL_VERSAO"
          chmod +x Instalador/montar-instalador.command \
                   Instalador/scripts/preinstall \
                   Instalador/scripts/postinstall \
                   Instalador/desinstalador/scripts/postinstall
          Instalador/montar-instalador.command "$PWD/Instalador/binarios" "$PWD/Instalador/modelos"
          ls -lh Instalador/saida

      # -----------------------------------------------------------------------
      # Trava de tamanho.
      #
      # O GitHub recusa anexo de Release acima de 2 GiB. Com o turbo embutido
      # a margem ficou em ~300 MB, entao qualquer modelo a mais estoura -- e
      # estouraria no passo do upload, depois de 20 minutos de build, com uma
      # mensagem que nao explica nada. Aqui para na hora e diz o porque.
      # -----------------------------------------------------------------------
      - name: O instalador cabe na Release?
        run: |
          set -e
          PKG=$(ls "$GITHUB_WORKSPACE/Instalador/saida/"TranscriberLive-*-macOS.pkg)
          BYTES=$(stat -f%z "$PKG")
          TETO=$((2 * 1024 * 1024 * 1024))

          printf 'instalador: %s (%.2f GiB)\n' "$(basename "$PKG")" "$(echo "$BYTES/1073741824" | bc -l)"

          if [ "$BYTES" -ge "$TETO" ]; then
            echo "::error::o instalador passou de 2 GiB ($BYTES bytes) — o GitHub Releases vai recusar."
            echo "::error::tire um modelo do passo 'Baixa os modelos' ou volte a baixar na instalacao."
            exit 1
          fi

      - name: Confere o que vai dentro do instalador
        run: |
          set -e
          cd "$RUNNER_TEMP" && rm -rf conf
          pkgutil --expand "$GITHUB_WORKSPACE/Instalador/saida/"TranscriberLive-*-macOS.pkg conf
          echo "### Arquivos do instalador" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          lsbom -s conf/base.pkg/Bom | grep -vE '/\._|/Contents/' | sort >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          # trava de seguranca: os 7 itens tem que estar la
          for E in 'VST3/Transcriber Live Receiver.vst3' 'VST3/Transcriber Live Display.vst3' \
                   'Components/Transcriber Live Receiver.component' 'Components/Transcriber Live Display.component' \
                   'Applications/Transcriber Live Display.app' \
                   'models/ggml-large-v3-turbo.bin' 'models/ggml-base.bin' 'models/ggml-silero-v5.1.2.bin'; do
            lsbom -s conf/base.pkg/Bom | grep -qF "$E" || { echo "::error::faltou no pacote: $E"; exit 1; }
          done
          echo "Instalador completo: 4 plugins + app + 3 modelos (turbo, base, VAD)."

          # Nenhum bundle pode ser relocavel. Se for, o Installer do macOS
          # instala em cima de qualquer copia do mesmo bundle que exista no
          # disco do cliente, em vez do caminho declarado -- e o app "some".
          # Ja aconteceu: o app foi parar em /Applications/arquivos porque
          # havia uma copia la.
          if grep -q "<relocate>" conf/base.pkg/PackageInfo; then
            echo "::error::o pacote tem bundle RELOCAVEL — o app pode ser instalado na pasta errada"
            grep -A5 "<relocate>" conf/base.pkg/PackageInfo
            exit 1
          fi
          echo "Nenhum bundle relocavel: o app vai para /Applications sempre."


      - name: Testa a desinstalacao de verdade
        run: |
          set -e
          sudo installer -pkg "$GITHUB_WORKSPACE/Instalador/saida/"TranscriberLive-*-macOS.pkg -target /
          test -d "/Library/Audio/Plug-Ins/VST3/Transcriber Live Receiver.vst3"
          test -f "/Library/Application Support/TranscriberLive/models/ggml-large-v3-turbo.bin"
          # o app tem que abrir: binario presente E executavel
          APPBIN="/Applications/Transcriber Live Display.app/Contents/MacOS/Transcriber Live Display"
          test -x "$APPBIN" || { echo "::error::o app instalado nao esta executavel"; ls -l "$APPBIN"; exit 1; }
          echo "instalado ok (app executavel)"
          sudo installer -pkg "$GITHUB_WORKSPACE/Instalador/saida/"*Desinstalador.pkg -target /
          for X in "/Library/Audio/Plug-Ins/VST3/Transcriber Live Receiver.vst3" \
                   "/Library/Audio/Plug-Ins/Components/Transcriber Live Receiver.component" \
                   "/Applications/Transcriber Live Display.app" \
                   "/Library/Application Support/TranscriberLive"; do
            if [ -e "$X" ]; then echo "::error::o desinstalador deixou para tras: $X"; exit 1; fi
          done
          echo "desinstalado ok — nada ficou para tras"

      - name: Publica na Release "macos-latest"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          gh release view macos-latest >/dev/null 2>&1 || \
            gh release create macos-latest --title "Transcriber Live — macOS (build mais recente)" \
               --notes "Instalador e desinstalador do macOS, gerados automaticamente a cada build. Os modelos de voz ja vem embutidos (Maxima precisao e Mais rapido): o cliente nao baixa nada." \
               --latest=false
          gh release upload macos-latest Instalador/saida/*.pkg --clobber

          # O nome do arquivo passou a levar a versao, entao "--clobber" nao
          # sobrescreve mais nada: a Release acumularia um .pkg por versao e o
          # cliente que entrasse na pagina escolheria no chute -- varias vezes o
          # antigo, que esta acima na lista. Fica so a versao deste build.
          VER=$(tr -d ' \n\r' < VERSAO)
          gh release view macos-latest --json assets -q '.assets[].name' | while read -r A; do
            case "$A" in
              *"-$VER-"*|*"-$VER."*) ;;
              "") ;;
              *) gh release delete-asset macos-latest "$A" -y && echo "removido da Release: $A" ;;
            esac
          done

          # A release reaproveita a mesma tag, entao a PAGINA continua mostrando
          # a data em que a tag foi criada -- e da a impressao de que o arquivo
          # e velho, mesmo tendo acabado de ser trocado. Reescrevemos titulo e
          # texto a cada build para a data e o commit ficarem visiveis.
          gh release edit macos-latest \
            --title "Transcriber Live $(tr -d ' \n\r' < VERSAO) - macOS ($(date -u '+%d/%m/%Y %H:%M') UTC)" \
            --notes "Instalador e desinstalador do macOS, gerados automaticamente.

          **Atualizado em:** $(date -u '+%d/%m/%Y as %H:%M') UTC
          **Commit:** \`${GITHUB_SHA:0:7}\`

          Os modelos de voz ja vem embutidos: o cliente nao baixa nada.
          O plugin escolhe entre eles conforme a capacidade da maquina."

          echo "### Download" >> "$GITHUB_STEP_SUMMARY"
          echo "Instalador e desinstalador em <${{ github.server_url }}/${{ github.repository }}/releases/tag/macos-latest>" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload do desinstalador (pequeno, fica como artefato tambem)
        uses: actions/upload-artifact@v4
        with:
          name: TranscriberLive-macOS-Desinstalador
          path: Instalador/saida/*Desinstalador.pkg
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Soma 1 ao numero menor da versao, depois de os dois instaladores saírem.
  #
  # Roda por ultimo e so se os dois publicaram: build que falhou nao gasta
  # numero de versao, senao a numeracao viraria contagem de tentativa.
  #
  # O "[skip ci]" na mensagem e o que impede o laco infinito -- sem ele este
  # push dispararia outro build, que faria outro push, para sempre.
  # ---------------------------------------------------------------------------
  proxima-versao:
    needs: [installer-macos, installer-windows]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Soma 1 ao numero menor
        run: |
          set -euo pipefail
          ATUAL=$(tr -d ' \n\r' < VERSAO)
          MAIOR=${ATUAL%%.*}
          MENOR=${ATUAL##*.}
          PROXIMA="$MAIOR.$((MENOR + 1))"
          echo "$ATUAL publicada -> proxima sera $PROXIMA"
          printf '%s\n' "$PROXIMA" > VERSAO

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSAO
          git commit -m "Versao $PROXIMA para o proximo build [skip ci]"

          # Outro push pode ter entrado enquanto o build rodava. Rebase e uma
          # tentativa a mais; falhar aqui NAO pode quebrar um build que ja
          # publicou os instaladores.
          for t in 1 2 3; do
            git push && exit 0
            echo "push recusado (tentativa $t); rebaseando"
            git pull --rebase --autostash || true
            sleep 3
          done
          echo "::warning::nao consegui gravar a proxima versao; o build seguinte repetiria $ATUAL"
